name: Vigia de cuotas minimas

on:
  # Igual que auto-registrar: lo lanza cron-job.org (llamada a la API,
  # "workflow_dispatch") cada pocos minutos. Sin "schedule" propio (GitHub
  # desactiva los programados de repos publicos tras 60 dias sin commits).
  # Dentro de la ventana de jornada se queda revisando CADA MINUTO (con
  # OddsPapi: cuotas reales de Winamax) hasta el final de la ventana o
  # 5 h 40 min (GitHub corta a las 6 h); entonces arranca la siguiente
  # llamada, que espera en la cola. Fuera de la ventana solo apunta
  # resultados y sale.
  workflow_dispatch:

# Uno cada vez: la siguiente llamada espera en la cola a que acabe este
concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-vigia.txt

      - name: Instalar dependencias
        run: pip install -r requirements-vigia.txt

      - name: Vigia (cada minuto durante la ventana)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          SHEET_ID_DATOS: ${{ secrets.SHEET_ID_DATOS }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m vigia --max-minutos 340
